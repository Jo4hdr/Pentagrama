<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Pentagrama</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-gray-50 text-gray-800">

    <header class="bg-gray-900 text-white">

        <nav class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row
                    justify-between items-center gap-4">

            <a href="index.html" class="text-3xl font-bold">
                🎵 Pentagrama
            </a>

            <div class="flex flex-wrap justify-center gap-4">
                <a href="index.html" class="hover:text-yellow-400">Inicio</a>
                <a href="productos.html" class="hover:text-yellow-400">Productos</a>
                <a href="categorias.html" class="hover:text-yellow-400">Categorías</a>
                <a href="clases.html" class="hover:text-yellow-400">Clases</a>
                <a href="nosotros.html" class="hover:text-yellow-400">Nosotros</a>
                <a href="contacto.html" class="text-yellow-400">Contacto</a>
            </div>

        </nav>

    </header>


    <section class="bg-gray-800 text-white py-14 text-center">

        <h1 class="text-4xl font-bold mb-3">
            Contacta con nosotros
        </h1>

        <p class="text-gray-300">
            ¿Tienes alguna pregunta? Escríbenos.
        </p>

    </section>


    <main class="max-w-4xl mx-auto px-6 py-14">

        <div class="bg-white rounded-xl shadow p-8">

            <form>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>
                        <label class="block font-semibold mb-2">
                            Nombre
                        </label>

                        <input
                            type="text"
                            placeholder="Escribe tu nombre"
                            class="w-full border border-gray-300 rounded-lg
                                   px-4 py-3 focus:outline-none
                                   focus:ring-2 focus:ring-gray-500">
                    </div>


                    <div>
                        <label class="block font-semibold mb-2">
                            Correo
                        </label>

                        <input
                            type="email"
                            placeholder="correo@ejemplo.com"
                            class="w-full border border-gray-300 rounded-lg
                                   px-4 py-3 focus:outline-none
                                   focus:ring-2 focus:ring-gray-500">
                    </div>

                </div>


                <div class="mt-6">

                    <label class="block font-semibold mb-2">
                        Asunto
                    </label>

                    <input
                        type="text"
                        placeholder="Escribe el asunto"
                        class="w-full border border-gray-300 rounded-lg
                               px-4 py-3 focus:outline-none
                               focus:ring-2 focus:ring-gray-500">

                </div>


                <div class="mt-6">

                    <label class="block font-semibold mb-2">
                        Mensaje
                    </label>

                    <textarea
                        rows="6"
                        placeholder="Escribe tu mensaje..."
                        class="w-full border border-gray-300 rounded-lg
                               px-4 py-3 focus:outline-none
                               focus:ring-2 focus:ring-gray-500"></textarea>

                </div>


                <button
                    type="submit"
                    class="mt-6 bg-gray-900 text-white px-7 py-3
                           rounded-lg font-semibold hover:bg-gray-700">

                    Enviar mensaje

                </button>

            </form>

        </div>

    </main>


    <footer class="bg-gray-900 text-gray-300 text-center py-8">
        <p>© 2032 Pentagrama. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
